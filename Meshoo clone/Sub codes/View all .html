<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .site-header { display:flex; align-items:center; justify-content:space-between; padding:12px 50px; background:#fff; border-bottom:1px solid #e2e2e2; position:sticky; top:0; z-index:1000; }
        .header-inner { display:flex; align-items:center; gap:30px; flex:1; }
        .brand { text-decoration:none; color:#f43397; font-size:32px; font-weight:800; }
        .search { display:flex; align-items:center; border:1px solid #ccc; padding:10px 15px; border-radius:4px; width:60%; background:#fff; }
        .search input { border:none; outline:none; width:100%; font-size:14px; }
        .nav { display:flex; align-items:center; gap:20px; }
        .btn-primary { background-color:#f43397; color:#fff; border:none; padding:10px 20px; border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:8px; }
        .link { text-decoration:none; color:#333; font-weight:500; font-size:15px; }
        .category-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; max-width:1200px; margin:40px auto; padding:0 20px; border-radius: 15%;}
        .category-card { text-decoration:none; min-width:180px; background:linear-gradient(180deg,#f0efff 0%,#fff 100%); border-radius:12px; border:1px solid #e2e2e2; display:flex; flex-direction:column; overflow:visible; }
        .category-card .thumb { height:180px; display:flex; align-items:center; justify-content:center; padding:20px; }
        .category-card img{ max-height:100%; object-fit:contain; border-radius:10px; }
        .category-label { background:#e90586; color:white; text-align:center; padding:12px; font-weight:bold; font-size:16px; }
        .nav-icon { font-size: 18px; }
        .nav-label { font-size: 12px; }
    </style>
</head>
