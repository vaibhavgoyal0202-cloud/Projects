<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Meesho</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background-color: #f8f9fa;
        }

        header {
            padding: 15px 50px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            text-decoration: none;
            color: #f43397;
            font-size: 28px;
            font-weight: 800;
        }

        .checkout-step {
            font-weight: bold;
            color: #666;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            display: flex;
            gap: 30px;
            padding: 0 20px;
        }

        .left {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .left h2 {
            font-size: 20px;
            margin: 0;
        }

        .cart-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-card img {
            width: 100px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cart-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-details h3 {
            margin: 0;
            font-size: 16px;
        }

        .cart-details p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }

        .item-price {
            font-size: 18px;
            font-weight: bold;
        }

        .item-actions {
            display: flex;
            gap: 20px;
        }

        .item-actions button {
            background: none;
            border: none;
            color: #f43397;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }

        .qty {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .qty button {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-value {
            min-width: 20px;
            text-align: center;
            display: inline-block;
        }

        .add-more {
            text-decoration: none;
            color: #f43397;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }

        .right {
            flex: 1;
        }

        .price-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .price-box h3 {
            margin: 0 0 20px 0;
            font-size: 16px;
            color: #666;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .discount {
            color: #038d63;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .success-banner {
            background: #f0fdf4;
            color: #038d63;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .continue-btn {
            width: 100%;
            background: #f43397;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .payments {
            margin-top: 20px;
            text-align: center;
        }

        .payments img {
            width: 100%;
            opacity: 0.7;
        }

        @media (max-width: 680px) {
            header { padding: 12px 20px; }
            main { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../Project sem 1 trial .html" class="brand">meesho</a>
        <div class="checkout-step">Checkout Step 1/3</div>
    </header>

    <main>
        <div class="left">
            <h2>Cart Items</h2>

            <div id="cart-items-container"></div>
            <div id="empty-cart-message" style="padding: 20px; background: white; border: 1px solid #ddd; border-radius: 8px; color: #666; display: none;">
                Your cart is empty. Add products from the home page to see them here.
            </div>

            <a href="../Project sem 1 trial .html" class="add-more">← Add more products</a>
        </div>

        <div class="right">
            <div class="price-box" aria-labelledby="price-details">
                <h3 id="price-details">Price Details</h3>

                <div class="price-row">
                    <span>Total Product Price</span>
                    <span id="total-price">₹0</span>
                </div>

                <div class="price-row discount">
                    <span>Product Discount</span>
                    <span>- ₹0</span>
                </div>

                <div class="total-row">
                    <span>Order Total</span>
                    <span id="order-total">₹0</span>
                </div>

                <div class="success-banner">Yay! Your total discount is ₹0</div>

                <button class="continue-btn">Continue</button>
            </div>

            <div class="payments">
                <img src="https://images.meesho.com/images/pow/safe-payments-desktop.webp" alt="secure payments">
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const cartContainer = document.getElementById('cart-items-container');
            const emptyMessage = document.getElementById('empty-cart-message');
            const totalPriceEl = document.getElementById('total-price');
            const orderTotalEl = document.getElementById('order-total');
            const successBanner = document.querySelector('.success-banner');
            let cartItems = JSON.parse(localStorage.getItem('cartItems') || '[]');

            function formatCurrency(n) {
                return '₹' + n;
            }

            function renderCart() {
                cartContainer.innerHTML = '';
                if (cartItems.length === 0) {
                    emptyMessage.style.display = 'block';
                    successBanner.textContent = 'Add items to your cart to see the total.';
                    updateTotals();
                    return;
                }

                emptyMessage.style.display = 'none';
                cartItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'cart-card';
                    card.setAttribute('role', 'group');
                    card.setAttribute('aria-label', item.name);
                    card.dataset.price = item.price;
                    card.dataset.id = item.id;

                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-details">
                            <div>
                                <h3>${item.name}</h3>
                                <p>Quantity: ${item.quantity}</p>
                            </div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <div class="item-price">${formatCurrency(item.price)}</div>
                                <div class="qty" aria-label="Quantity">
                                    <button class="qty-decrease" aria-label="Decrease quantity">-</button>
                                    <span class="qty-value">${item.quantity}</span>
                                    <button class="qty-increase" aria-label="Increase quantity">+</button>
                                </div>
                            </div>
                            <div class="item-actions" aria-hidden="false">
                                <button class="remove">REMOVE</button>
                                <button class="edit">EDIT</button>
                            </div>
                        </div>
                    `;
                    cartContainer.appendChild(card);
                });
                successBanner.textContent = `Yay! Your total discount is ₹0`;
                updateTotals();
            }

            function updateTotals() {
                const cards = document.querySelectorAll('.cart-card');
                let productTotal = 0;
                cards.forEach(card => {
                    const price = parseFloat(card.dataset.price) || 0;
                    const qty = parseInt(card.querySelector('.qty-value').textContent, 10) || 0;
                    productTotal += price * qty;
                });

                totalPriceEl.textContent = formatCurrency(productTotal);
                orderTotalEl.textContent = formatCurrency(productTotal);
            }

            function saveCart() {
                localStorage.setItem('cartItems', JSON.stringify(cartItems));
            }

            document.body.addEventListener('click', function (e) {
                if (e.target.matches('.qty-increase') || e.target.matches('.qty-decrease')) {
                    const card = e.target.closest('.cart-card');
                    const qtyEl = card.querySelector('.qty-value');
                    const index = Array.from(cartContainer.children).indexOf(card);
                    let current = parseInt(qtyEl.textContent, 10);

                    if (e.target.matches('.qty-increase')) {
                        current += 1;
                    } else if (e.target.matches('.qty-decrease') && current > 1) {
                        current -= 1;
                    }

                    qtyEl.textContent = current;
                    const itemId = card.dataset.id;
                    const item = cartItems.find(product => product.id === itemId);
                    if (item) {
                        item.quantity = current;
                        saveCart();
                    }
                    updateTotals();
                } else if (e.target.matches('.remove')) {
                    const card = e.target.closest('.cart-card');
                    if (!card) return;
                    const itemId = card.dataset.id;
                    cartItems = cartItems.filter(product => product.id !== itemId);
                    saveCart();
                    renderCart();
                } else if (e.target.matches('.edit')) {
                    alert('Edit functionality not implemented.');
                }
            });

            renderCart();
        });
    </script>
</body>
</html>
