<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .site-header { display:flex; align-items:center; justify-content:space-between; padding:12px 50px; background:#fff; border-bottom:1px solid #e2e2e2; }
        .brand { text-decoration:none; color:#f43397; font-size:32px; font-weight:800; }
        h1 { text-align:center; margin-top:20px; }
        .product-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:20px; max-width:1200px; margin:20px auto; }
        .product-card { border:1px solid #eee; border-radius:8px; padding:16px; background:#fff; text-align:center; }
        .price{ font-weight:bold; color:#f43397; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="/" class="brand">meesho</a>
    </header>

    <h1>Books</h1>

    <div class="product-grid">
        <div class="product-card">
            <img src="https://www.penguinrandomhouse.ca/sites/default/files/2025-11/Cover%20Template.jpg" alt="Sample Book">
            <h2>Sample Book</h2>
            <p class="price">₹299</p>
        </div>
    </div>
</body>
</html>
